[tool.poetry]
name = "python-api-itom"
version = "0.1.0"
description = "API de Gestão de Ativos e Incidentes de TI"
authors = ["Seu Nome <seu.email@exemplo.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
flask = "^3.0.0"
flask-restx = "^1.3.0"
